<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="contact-form.css">
</head>
<body>
    <div class="contact-form">

        <h1>Contact Form</h1>
        <p>Please fill all the texts in the fields.</p>

        <hr>

        <form>
            <div class="form-row">
                <label for="name">Your Name :</label>
                <input type="text" id="name" placeholder="Your Full Name" required>
            </div>

            <div class="form-row">
                <label for="email">Your Email :</label>
                <input type="email" id="email" placeholder="Valid Email Address" required>
            </div>

            <div class="form-row">
                <label for="message">Message :</label>
                <textarea id="message" placeholder="Your Message to Us" required></textarea>
            </div>

            <div class="form-row">
                <label for="subject">Subject :</label>
                <select id="subject">
                    <option>Job Inquiry</option>
                    <option>General Inquiry</option>
                    <option>Support</option>
                </select>
            </div>

            <div class="button-row">
                <button type="submit">Send</button>
            </div>
        </form>

    </div>

</body>
</html>
