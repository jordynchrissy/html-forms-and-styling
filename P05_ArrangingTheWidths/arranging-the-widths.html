<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arranging the Widths</title>
    <link rel="stylesheet" href="arranging-the-widths.css">
</head>
<body>
    <form>

        <fieldset>

            <legend>Rent Audi Vehicles</legend>

            <label for="name">Named</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label for="vehicle">Select</label>
            <select id="vehicle">
                <option>Audi 80</option>
                <option>Audi A3</option>
                <option>Audi A4</option>
                <option>Audi A6</option>
            </select>

            <label for="rental">Select</label>
            <select id="rental">
                <option>Select</option>
                <option>Daily</option>
                <option>Weekly</option>
                <option>Monthly</option>
            </select>

            <label for="message">Message:</label>
            <textarea id="message"></textarea>

        </fieldset>

    </form>
</body>
</html>
