<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form Font Awesome</title>
    <link rel="stylesheet" href="login-form-font-awesome.css">

</head>
<body>
<main>

        <div class="image-container">
            <img src="images/image-photo.jpg" alt="Profile Picture">
        </div>

        <h2>Flat Business Profile Widget</h2>

        <form>

            <div class="input-container">
                <i class="fa fa-user" aria-hidden="true"></i>
                <input type="text" placeholder="Name" required>
            </div>

            <div class="input-container">
                <i class="fa fa-unlock-alt" aria-hidden="true"></i>
                <input type="password" placeholder="Password" required>
            </div>

            <input type="submit" value="Submit">

        </form>

    </main>

    <footer>
        <p>&copy; 2016 Flat Business Profile Widget. All rights reserved.</p>
    </footer>

</body>
</html>
